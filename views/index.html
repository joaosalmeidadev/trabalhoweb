<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="texto-topo">Receitas</h1>
        <p>Colocar aqui as receitas mais pesquisadas (ou as mais famosas)</p>
    </header>

    <main>
        <section>
            <h2>Pesquisar receitas</h2>

            <form id="formPesquisa">
                <label for="nomeReceita">Nome da receita:</label>
                <input type="text" id="nomeReceita" placeholder="Ex: Pizza" class="input">

                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="Ex: Italiana" class="input">

                <label for="ingrediente">Ingrediente:</label>
                <input type="text" id="ingrediente" placeholder="Ex: Queijo" class="input">

                <label for="país">País:</label>
                <input type="text" id="pais" placeholder="Ex: Brasil" class="input">
                <button type="submit" class="button">Pesquisar</button>
            </form>
        </section>

        <section>
            <h2>Resultados da pesquisa</h2>

            <div id="resultados">
                <p>Pesquise uma receita.</p>
            </div>
            <section id="detalhesReceita"></section>
        </section>
    </main>

    <footer>
        <p>Receitas - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
