<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
</head>
<body>

    <header>
        <h1>Receitas</h1>
        <p>Colocar aqui as receitas mais pesquisadas (ou as mais famosas)</p>
    </header>

    <main>
        <section>
            <h2>Pesquisar receitas</h2>

            <form id="formPesquisa">
                <label for="nomeReceita">Nome da receita:</label>
                <input type="text" id="nomeReceita" placeholder="Ex: Pizza">

                <button type="submit">Pesquisar</button>
            </form>
        </section>

        <section>
            <h2>Resultados da pesquisa</h2>

            <div id="resultados">
                <p>Pesquise uma receita.</p>
            </div>
            <section id="detalhesReceita"></section>
        </section>
    </main>

    <footer>
        <p>Receitas - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
