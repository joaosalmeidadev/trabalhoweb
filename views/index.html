<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="visual.css">
</head>

<body>

    <header>
        <h1 class="texto-topo">Receitas</h1>
        <p>Colocar aqui as receitas mais pesquisadas (ou as mais famosas)</p>
    </header>

    <main>
        <section>
            <h2>Pesquisar receitas</h2>

            <form id="formPesquisa">
                <label for="nomeReceita">Nome da receita:</label>
                <input type="text" id="nomeReceita" placeholder="Ex: Pizza" class="input">

                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="Ex: Italiana" class="input">

                <label for="ingrediente">Ingrediente:</label>
                <input type="text" id="ingrediente" placeholder="Ex: Queijo" class="input">

                <label for="país">País:</label>
                <input type="text" id="pais" placeholder="Ex: Brasil" class="input">
                <button type="submit" class="button">Pesquisar</button>
            </form>
        </section>

        <section>
            <h2>Resultados da pesquisa</h2>

            <div id="resultados">
                <p>Pesquise uma receita.</p>
            </div>
            <section id="detalhesReceita"></section>
        </section>



        <section>
            <h1>Crie uma Receita!</h1>
            <form id="formCadastro" action="/api/receitas" method="POST">
                <label for="nome">Nome da receita:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Pizza" class="input" required>

                <label for="categoriaCadastro">Categoria:</label>
                <input type="text" id="categoriaCadastro" name="categoria" placeholder="Ex: Massas" class="input"
                    required>

                <label for="paisCadastro">País:</label>
                <input type="text" id="paisCadastro" name="pais" placeholder="Ex: Itália" class="input" required>

                <label for="autor">Autor:</label>
                <input type="text" id="autor" name="autor" placeholder="Ex: João Silva" class="input" required>

                <label for="foto">URL da Foto (opcional):</label>
                <input type="text" id="foto" name="foto" placeholder="https://..." class="input">

                <label for="ingredientes">Ingredientes (separe por vírgula ou quebra de linha):</label>
                <textarea id="ingredientes" name="ingredientes" placeholder="Ex: 200g de queijo, 3 tomates, massa..."
                    class="input" required></textarea>

                <label for="instrucoes">Modo de Preparo:</label>
                <textarea id="instrucoes" name="modo_de_preparo" placeholder="Ex: Misture os ingredientes e asse..."
                    class="input" required></textarea>

                <button type="submit" class="button">Cadastrar Receita</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Receitas - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
