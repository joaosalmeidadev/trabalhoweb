<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
</head>
<body>

    <header>
        <h1>Site de Receitas</h1>
    </header>

    <main>
        <section id="pesquisa">
            <form action="/" method="GET">
                <label>Pesquisar</label>
                <input type="text" name="pesquisa_nome" placeholder="Nome">
                <input type="text" name="pesquisa_ingredientes" placeholder="Ingredientes">
                <input type="text" name="pesquisa_categoria" placeholder="Categoria">
                <input type="text" name="pesquisa_autor" placeholder="Autor">
                <button type="submit">Pesquisar</button>
            </form>
        </section>

        <section id="receitas">
            <h2>Receitas</h2>

            <article>
                <h3>Título da receita</h3>
                <p>Categoria: ... | Autor: ...</p>
                <p>Ingredientes: ...</p>
                <p>Modo de preparo: ...</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Trabalho final de Desenvolvimento Web</p>
    </footer>

</body>
</html>
